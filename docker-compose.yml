services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dms_wordpress}
      MYSQL_USER: ${MYSQL_USER:-dms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dms_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-dms_wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-dms}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-dms_dev_password}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/dms-corporate:/var/www/html/wp-content/themes/dms-corporate

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-dms_wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-dms}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-dms_dev_password}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/dms-corporate:/var/www/html/wp-content/themes/dms-corporate
      - ./scripts:/workspace/scripts:ro
    working_dir: /var/www/html

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}

volumes:
  db_data:
  wordpress_data:
