services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dms_cms}
      MYSQL_USER: ${MYSQL_USER:-dms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dms_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 25

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Digital Multi Sinergy}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-dms_cms}
      DB_USER: ${MYSQL_USER:-dms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-dms_dev_password}
      CMS_ADMIN_NAME: ${CMS_ADMIN_NAME:-DMS Administrator}
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-admin@dms.local}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-AdminDMS!2026}
      COMPANY_NAME: ${COMPANY_NAME:-Digital Multi Sinergy}
      COMPANY_TAGLINE: ${COMPANY_TAGLINE:-Technology & Connectivity}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-info@digitalmultisinergy.co.id}
      COMPANY_PHONE: ${COMPANY_PHONE:-+62 878-9111-8166}
      COMPANY_WHATSAPP: ${COMPANY_WHATSAPP:-6287891118166}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-Cervino Apartment, Office Floor L1, M, N, Jl. KH Abdullah Syafei No.27, RT.3/RW.1, Tebet Barat, Kec. Tebet, Daerah Khusus Ibukota Jakarta 12810}
      COMPANY_HOURS: ${COMPANY_HOURS:-Senin-Jumat, 09.00-17.00 WIB}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-https://www.instagram.com/digitalmultisinergy.official}
      LINKEDIN_URL: ${LINKEDIN_URL:-https://www.linkedin.com/company/digitalmultisinergy}
      MAP_QUERY: ${MAP_QUERY:-Cervino Apartment Office Floor L1 M N Jl KH Abdullah Syafei No 27 Tebet Jakarta 12810}
      PROJECT_COUNT: ${PROJECT_COUNT:-50+}
      PARTNER_COUNT: ${PARTNER_COUNT:-20+}
      EXPERIENCE_YEARS: ${EXPERIENCE_YEARS:-4+}
    volumes:
      - ./public:/var/www/html:ro
      - ./app:/var/www/app:ro
      - uploads_data:/var/www/html/uploads
    command: sh -c "chown -R www-data:www-data /var/www/html/uploads && apache2-foreground"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health') === 'OK' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}

volumes:
  db_data:
  uploads_data:
